<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'none'; style-src 'unsafe-inline'"
  >
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ZbrePrinter</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: #f4f4f2;
      color: #171717;
    }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
    }
    main {
      width: min(420px, calc(100vw - 48px));
      padding: 34px;
      border: 1px solid #deded9;
      border-radius: 18px;
      background: #fff;
      box-shadow: 0 18px 50px rgba(0, 0, 0, .08);
    }
    h1 {
      margin: 0 0 8px;
      font-size: 27px;
      letter-spacing: -.03em;
    }
    p {
      margin: 0;
      color: #64645f;
      line-height: 1.55;
    }
    .bar {
      height: 4px;
      margin-top: 28px;
      overflow: hidden;
      border-radius: 999px;
      background: #ecece8;
    }
    .bar::after {
      content: "";
      display: block;
      width: 42%;
      height: 100%;
      border-radius: inherit;
      background: #171717;
      animation: loading 1.1s ease-in-out infinite alternate;
    }
    @keyframes loading {
      from { transform: translateX(-10%); }
      to { transform: translateX(155%); }
    }
  </style>
</head>
<body>
  <main>
    <h1>ZbrePrinter</h1>
    <p>Đang khởi động bộ thiết kế và dịch vụ in cục bộ…</p>
    <div class="bar" aria-hidden="true"></div>
  </main>
</body>
</html>
